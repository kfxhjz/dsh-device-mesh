name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full run (including the real paseo-relay E2E) at 02:30 UTC.
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
        include:
          # Windows is not a supported runtime target yet, but keeping the
          # build/typecheck/lint/unit suites green there prevents platform drift.
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the packed tarball contains both runtime entries
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          grep -q 'total files: 11' /tmp/pack.log
          grep -q 'client.js' /tmp/pack.log
          grep -q 'lib/host/index.js' /tmp/pack.log
        shell: bash
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Coverage gate (full source, Node 26)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26
        run: npm run test:coverage

  e2e:
    name: E2E (stock dsh web)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: npm ci
      - run: npm run build
      - name: Install the DSH CLI used by the harness
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.2
      - name: Ensure Chrome for the browser E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_PATH" || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
      - name: Run end-to-end tests
        env:
          DSH_CLI: dsh
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: .test/e2e/evidence
          if-no-files-found: ignore

  e2e-relay:
    name: E2E (real paseo-relay)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: npm ci
      - run: npm run build
      - name: Install the DSH CLI used by the harness
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.2
      - name: Restore the cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/paseo-relay-target
          key: paseo-relay-${{ runner.os }}-v0.1.2
      - name: Build the pinned paseo-relay binary
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
          fi
          git clone --depth 1 --branch v0.1.2 https://github.com/kfxhjz/paseo-relay /tmp/paseo-relay
          cd /tmp/paseo-relay
          CARGO_TARGET_DIR=/tmp/paseo-relay-target cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/.build/bin"
          cp /tmp/paseo-relay-target/release/paseo-relay "$GITHUB_WORKSPACE/.build/bin/paseo-relay"
          "$GITHUB_WORKSPACE/.build/bin/paseo-relay" --version
      - name: Run the real-relay unit and E2E suites
        env:
          DSH_CLI: dsh
          PASEO_RELAY_BIN: ${{ github.workspace }}/.build/bin/paseo-relay
        run: |
          node --import tsx --test test/transport/relay-e2e.test.ts test/e2e/relay.test.ts
