name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm provenance uses the GitHub OIDC token.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # npm exchanges the GitHub OIDC token for a short-lived publish token
          # through the package's Trusted Publisher; no NPM_TOKEN is read here.
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: npm ci
      - name: Verify the tag matches package.json
        run: node scripts/release-notes.mjs --check-tag
      - name: Install the DSH CLI used by the harness
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.2
      - name: Ensure Chrome for the browser E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_PATH" || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
      - name: Release gate (build, lint, unit, E2E, pack)
        env:
          DSH_CLI: dsh
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run release:check
      - name: Pack the publishable tarball
        run: npm pack
      - name: Write checksums and release notes
        run: |
          sha256sum dsh-device-mesh-*.tgz > SHA256SUMS
          cat SHA256SUMS
          node scripts/release-notes.mjs --tarball "$(ls dsh-device-mesh-*.tgz)"
      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: dsh-device-mesh-tarball
          path: dsh-device-mesh-*.tgz
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: |
            dsh-device-mesh-*.tgz
            SHA256SUMS
          fail_on_unmatched_files: true
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-device-mesh@${version}" version >/dev/null 2>&1; then
            echo "dsh-device-mesh@${version} is already published; skipping"
          else
            # Trusted publishing: npm uses the workflow's OIDC token, so there
            # is deliberately no NODE_AUTH_TOKEN / NPM_TOKEN here.
            npm publish --access public --provenance
          fi
