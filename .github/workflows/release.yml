name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm provenance uses the GitHub OIDC token.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # Writes the npm auth line that NODE_AUTH_TOKEN below fills in.
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: npm ci
      - name: Verify the tag matches package.json
        run: node scripts/release-notes.mjs --check-tag
      - name: Install the DSH CLI used by the harness
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.2
      - name: Ensure Chrome for the browser E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_PATH" || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
      - name: Release gate (build, lint, unit, E2E, pack)
        env:
          DSH_CLI: dsh
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run release:check
      - name: Pack the publishable tarball
        run: npm pack
      - name: Write checksums and release notes
        run: |
          sha256sum dsh-device-mesh-*.tgz > SHA256SUMS
          cat SHA256SUMS
          node scripts/release-notes.mjs --tarball "$(ls dsh-device-mesh-*.tgz)"
      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: dsh-device-mesh-tarball
          path: dsh-device-mesh-*.tgz
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: |
            dsh-device-mesh-*.tgz
            SHA256SUMS
          fail_on_unmatched_files: true
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: npm publish skipped
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not configured; skipping npm publish."
