name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the packed tarball contains both runtime entries
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          grep -q 'total files: 11' /tmp/pack.log
          grep -q 'client.js' /tmp/pack.log
          grep -q 'lib/host/index.js' /tmp/pack.log
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (stock dsh web)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: npm ci
      - run: npm run build
      - name: Install the DSH CLI used by the harness
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.2
      - name: Ensure Chrome for the browser E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          test -x "$CHROME_PATH" || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
      - name: Run end-to-end tests
        env:
          DSH_CLI: dsh
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .test/e2e/evidence
          if-no-files-found: ignore
